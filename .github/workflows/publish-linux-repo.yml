name: Publish Linux Flatpak repository
# Builds the released commit, signs it, and serves the Flatpak repository on GitHub Pages
# (https://madaai.github.io/Zyclipa/) so installed copies update in-app or with `flatpak update`.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to publish (normally the latest release tag)
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: linux-flatpak-repo
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Google sign-in client
        env:
          GOOGLE_OAUTH_JSON: ${{ secrets.GOOGLE_OAUTH_JSON }}
        run: |
          if [ -n "$GOOGLE_OAUTH_JSON" ]; then mkdir -p private && printf '%s' "$GOOGLE_OAUTH_JSON" > private/google-oauth.json; fi
      - name: Build the Linux jar
        run: mvn -B -DskipTests package
      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub org.gnome.Platform//49 org.gnome.Sdk//49 org.freedesktop.Sdk.Extension.openjdk25//25.08
      - name: Import repository signing key
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          test -n "$FLATPAK_GPG_PRIVATE_KEY" || { echo "::error::Add the FLATPAK_GPG_PRIVATE_KEY secret (see README, Linux)"; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m 700 -p "$GNUPGHOME"
          echo "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "FLATPAK_GPG_HOMEDIR=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Build and sign
        env:
          FLATPAK_GPG_KEY_ID: 38C19B2C34C73B15185E69475CB6FCE9D086E305
        run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zyclipa-linux-release
          path: |
            dist/*.flatpak
            dist/*.sha256
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/linux-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
